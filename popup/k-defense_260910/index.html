<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기로에 선 K-방산</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b1424;
            color: #fff;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        button,
        a {
            font: inherit;
        }

        .video-popup {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(145deg, #101d32 0%, #07101f 100%);
        }

        .popup-header {
            padding: 22px 24px 17px;
        }

        .popup-kicker {
            margin: 0 0 6px;
            color: #9eb7dc;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .popup-title {
            margin: 0;
            font-size: clamp(24px, 4vw, 34px);
            line-height: 1.25;
        }

        .video-area {
            flex: 1 1 auto;
            min-height: 0;
            padding: 0 24px;
        }

        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.32);
        }

        .video-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 24px 12px;
        }

        .video-title {
            min-width: 0;
            margin: 0;
            color: #e8eef8;
            font-size: 15px;
            line-height: 1.45;
        }

        .youtube-link {
            flex: 0 0 auto;
            color: #b9c9e2;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .youtube-link:hover,
        .youtube-link:focus-visible {
            color: #fff;
            text-decoration: underline;
        }

        .part-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 24px 18px;
        }

        .part-button {
            min-height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.06);
            color: #dfe8f6;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .part-button:hover,
        .part-button:focus-visible {
            background: rgba(255, 255, 255, 0.13);
        }

        .part-button.is-active {
            border-color: #d3a64f;
            background: #d3a64f;
            color: #111827;
        }

        .popup-preferences {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 46px;
            margin-top: auto;
            border-top: 1px solid rgba(16, 22, 36, 0.12);
            background: #fff;
        }

        .popup-preference-button {
            border: 0;
            background: #fff;
            color: #263247;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .popup-preference-button + .popup-preference-button {
            border-left: 1px solid rgba(16, 22, 36, 0.12);
        }

        .popup-preference-button:hover,
        .popup-preference-button:focus-visible {
            background: #f2f5f9;
        }

        @media (max-width: 640px) {
            .popup-header {
                padding: 18px 16px 14px;
            }

            .video-area,
            .part-controls {
                padding-right: 16px;
                padding-left: 16px;
            }

            .video-meta {
                align-items: flex-start;
                padding-right: 16px;
                padding-left: 16px;
            }

            .video-title {
                font-size: 14px;
            }

            .youtube-link {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="video-popup" aria-label="기로에 선 K-방산 영상 팝업">
        <header class="popup-header">
            <p class="popup-kicker">연합뉴스경제TV · 인사이트30</p>
            <h1 class="popup-title">기로에 선 K-방산</h1>
        </header>

        <section class="video-area" aria-label="영상 재생 영역">
            <div class="video-frame">
                <iframe
                    data-video-frame
                    src="https://www.youtube-nocookie.com/embed/hcC0IRgmNWo?rel=0"
                    title="기로에 선 K-방산 1부"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <div class="video-meta">
            <p class="video-title" data-video-title aria-live="polite"></p>
            <a class="youtube-link" data-youtube-link href="https://www.youtube.com/watch?v=hcC0IRgmNWo" target="_blank" rel="noopener noreferrer">
                YouTube에서 보기
            </a>
        </div>

        <nav class="part-controls" aria-label="영상 부 선택">
            <button class="part-button is-active" type="button" data-part="0" aria-pressed="true">기로에 선 K-방산 1부</button>
            <button class="part-button" type="button" data-part="1" aria-pressed="false">기로에 선 K-방산 2부</button>
        </nav>

        <div class="popup-preferences">
            <button class="popup-preference-button" type="button" data-popup-hide-today>오늘 하루 보지 않기</button>
            <button class="popup-preference-button" type="button" data-popup-hide-forever>다시 보지 않기</button>
        </div>
    </main>

    <script>
        (function () {
            const storageKey = 'jbnuKDefenseMainPopup260910HiddenUntil';
            const foreverValue = 'forever';
            const videos = [
                {
                    id: 'hcC0IRgmNWo',
                    label: '기로에 선 K-방산 1부',
                    title: "'가성비·빠른 납기'로는 더 이상 안 된다…'수주 연패' K-방산 위기론의 실체"
                },
                {
                    id: 'yPlWQiGMb9c',
                    label: '기로에 선 K-방산 2부',
                    title: '“체급 키워 세계 무대로”…대형화·통합화 흐름의 세계 방산'
                }
            ];
            const frame = document.querySelector('[data-video-frame]');
            const title = document.querySelector('[data-video-title]');
            const youtubeLink = document.querySelector('[data-youtube-link]');
            const partButtons = Array.from(document.querySelectorAll('[data-part]'));
            const hideToday = document.querySelector('[data-popup-hide-today]');
            const hideForever = document.querySelector('[data-popup-hide-forever]');
            let activeIndex = 0;

            function showVideo(index) {
                const video = videos[index];

                if (!video || index === activeIndex && frame.dataset.loaded === 'true') {
                    return;
                }

                activeIndex = index;
                frame.src = `https://www.youtube-nocookie.com/embed/${video.id}?rel=0`;
                frame.title = video.label;
                frame.dataset.loaded = 'true';
                title.textContent = video.title;
                youtubeLink.href = `https://www.youtube.com/watch?v=${video.id}`;

                partButtons.forEach((button, buttonIndex) => {
                    const isActive = buttonIndex === activeIndex;
                    button.classList.toggle('is-active', isActive);
                    button.setAttribute('aria-pressed', String(isActive));
                });
            }

            function getTomorrowStart() {
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(0, 0, 0, 0);
                return tomorrow.getTime();
            }

            function closePopup() {
                if (window.opener) {
                    window.close();
                    return;
                }

                const targetOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
                window.parent.postMessage({ type: 'jbnu-main-popup-close' }, targetOrigin);
            }

            partButtons.forEach(button => {
                button.addEventListener('click', () => showVideo(Number(button.dataset.part)));
            });

            hideToday.addEventListener('click', () => {
                localStorage.setItem(storageKey, String(getTomorrowStart()));
                closePopup();
            });

            hideForever.addEventListener('click', () => {
                localStorage.setItem(storageKey, foreverValue);
                closePopup();
            });

            showVideo(0);
        })();
    </script>
</body>
</html>
