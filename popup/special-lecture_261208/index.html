<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>전북대학교 석좌교수 특별강연 | 국방산업연구소</title>
    <style>
        @font-face { font-family: "SUIT"; src: url("../employment_260928/fonts/SUIT-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
        * { box-sizing: border-box; }
        html, body { overflow: hidden; }
        body { margin: 0; background: #061327; color: #fff; font-family: "SUIT", system-ui, sans-serif; }
        .popup { display: flex; height: 100vh; height: 100dvh; flex-direction: column; overflow: hidden; border: 2px solid #dcb960; background: #061327; }
        .brand { display: flex; flex: 0 0 48px; min-height: 0; margin: 0; padding: 0 48px 0 16px; align-items: center; border-bottom: 1px solid #36516c; font-size: 17px; font-weight: 800; line-height: 1.4; }
        .poster-link { display: block; flex: 1; min-height: 0; overflow: hidden; background: #020b17; }
        .poster-link img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .notice-link { display: flex; flex: 0 0 52px; min-height: 0; padding: 4px 20px; align-items: center; justify-content: space-between; gap: 12px; background: #f0cf78; color: #071a30; font-size: 18px; font-weight: 900; line-height: 1.3; text-decoration: none; }
        .notice-link:hover { background: #ffe49f; }
        a:focus-visible, button:focus-visible { outline: 3px solid #55ceff; outline-offset: -3px; }
        footer { display: flex; flex: 0 0 44px; min-height: 0; border-top: 1px solid #36516c; }
        footer button { flex: 1; min-width: 0; padding: 4px; border: 0; background: transparent; color: #e9eff6; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
        footer button + button { border-left: 1px solid #36516c; }
        footer button:hover { background: #163754; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
        @media (max-width: 420px) {
            .brand { padding-left: 12px; font-size: 14px; }
            .notice-link { padding: 4px 14px; font-size: 16px; }
            footer button { font-size: 12px; }
        }
    </style>
</head>
<body>
    <main class="popup" aria-label="전북대학교 석좌교수 특별강연 안내">
        <p class="brand" data-copy="brand">전북대학교 국방산업연구소</p>
        <h1 class="sr-only" data-copy="heading">글로벌 방위산업 동향 및 한미 방산협력 강화방안</h1>
        <a class="poster-link" href="../../pages/community/view.html?post=view_08" target="_top" aria-label="특별강연 공지사항 자세히 보기">
            <img src="poster.png" alt="전북대학교 석좌교수 특별강연. 글로벌 방위산업 동향 및 한미 방산협력 강화방안. 연사 Andrew Philip Hunter, 전 미국 공군성 획득 차관보·전북대-퍼듀대 고등연구소(JPRI) 석좌교수. 2026년 12월 8일 화요일 14시부터 16시까지 JBNU인터내셔널센터 7층 동행홀에서 개최. 방위산업에 관심 있는 재학생 및 교직원 대상. 문의 첨단방위산업학과 063-270-4731.">
        </a>
        <a class="notice-link" href="../../pages/community/view.html?post=view_08" target="_top"><span data-copy="notice">특별강연 공지사항 자세히 보기</span><span aria-hidden="true">→</span></a>
        <footer>
            <button type="button" data-hide-today data-copy="today">오늘 하루 보지 않기</button>
            <button type="button" data-hide-forever data-copy="forever">다시 보지 않기</button>
            <button type="button" data-close data-copy="close">닫기</button>
        </footer>
    </main>
    <script>
        (function () {
            const storageKey = 'jbnuSpecialLecture261208HiddenUntil';
            if (localStorage.getItem('jbnu-defense-language') === 'en') {
                const copy = {
                    brand: 'K-Defense Industry Research Institute',
                    heading: 'Global Defense Industry Trends and Strengthening ROK–U.S. Defense Industry Cooperation',
                    notice: 'Special Lecture Details',
                    today: 'Hide for Today', forever: 'Do Not Show Again', close: 'Close'
                };
                document.documentElement.lang = 'en';
                document.title = 'Andrew Philip Hunter Special Lecture | K-Defense Industry Research Institute';
                document.querySelector('main').setAttribute('aria-label', 'JBNU Distinguished Professor Special Lecture');
                document.querySelector('.poster-link').setAttribute('aria-label', 'View the special lecture notice');
                document.querySelector('img').alt = 'JBNU Distinguished Professor Special Lecture: Global Defense Industry Trends and Strengthening ROK–U.S. Defense Industry Cooperation. Speaker: Andrew Philip Hunter, former Assistant Secretary of the U.S. Air Force for Acquisition and Distinguished Professor at the JBNU-Purdue Research Institute (JPRI). December 8, 2026, 14:00–16:00. Donghaeng Hall, 7th floor, JBNU International Center. For students, faculty and staff interested in the defense industry. Contact: Department of Advanced Defense Technology and Industry, 063-270-4731.';
                document.querySelectorAll('[data-copy]').forEach(element => { element.textContent = copy[element.dataset.copy]; });
            }
            function closePopup() {
                if (window.opener) { window.close(); return; }
                const targetOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
                window.parent.postMessage({ type: 'jbnu-main-popup-close' }, targetOrigin);
            }
            document.querySelectorAll('.poster-link, .notice-link').forEach(link => {
                link.addEventListener('click', event => {
                    if (window.opener && !window.opener.closed) {
                        event.preventDefault();
                        window.opener.location.href = event.currentTarget.href;
                        window.opener.focus();
                        window.close();
                    }
                });
            });
            document.querySelector('[data-hide-today]').addEventListener('click', () => {
                const offset = 9 * 60 * 60 * 1000;
                const day = 24 * 60 * 60 * 1000;
                localStorage.setItem(storageKey, String((Math.floor((Date.now() + offset) / day) + 1) * day - offset));
                closePopup();
            });
            document.querySelector('[data-hide-forever]').addEventListener('click', () => { localStorage.setItem(storageKey, 'forever'); closePopup(); });
            document.querySelector('[data-close]').addEventListener('click', closePopup);
        })();
    </script>
</body>
</html>
