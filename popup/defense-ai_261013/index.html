<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>국방 AI 혁신과 K-방산의 새로운 도약 | 국방산업연구소</title>
    <style>
        @font-face { font-family: "Gmarket Sans"; src: url("../employment_260928/fonts/GmarketSansBold.woff") format("woff"); font-weight: 700; font-display: swap; }
        @font-face { font-family: "SUIT Variable"; src: url("../employment_260928/fonts/SUIT-Variable.woff2") format("woff2-variations"); font-weight: 100 900; font-display: swap; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #071322; color: #fff; font-family: "SUIT Variable", system-ui, sans-serif; }
        .news-popup { position: relative; isolation: isolate; display: flex; flex-direction: column; height: 100vh; border: 3px solid #c9a462; }
        .news-popup::before { position: absolute; z-index: -2; inset: 0; content: ""; background: url('../employment_260928/employment-defense-bg.png') center / cover; }
        .news-popup::after { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(100deg, rgba(2, 12, 28, 0.96), rgba(6, 27, 50, 0.84) 65%, rgba(6, 27, 50, 0.54)); }
        .content { flex: 1; min-height: 0; overflow-y: auto; padding: 29px 34px 26px; }
        .brand { margin: 0; color: #d9bd86; font-size: 11px; font-weight: 850; letter-spacing: 0.11em; }
        .kicker { display: inline-block; margin: 23px 0 16px; padding: 7px 12px; border: 1px solid #728fa9; border-radius: 4px; color: #dceaf6; font-size: 13px; font-weight: 800; }
        h1 { margin: 0; font-family: "Gmarket Sans", sans-serif; font-size: clamp(29px, 6vw, 42px); font-weight: 700; line-height: 1.45; letter-spacing: -0.035em; word-break: keep-all; }
        h1 span { display: block; }
        h1 .accent { color: #e4bf74; }
        .summary { margin: 17px 0 0; color: #d8e5f1; font-size: 17px; font-weight: 650; line-height: 1.65; word-break: keep-all; }
        .insights { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
        .insights article { padding: 15px 12px; border: 1px solid #56728d; border-radius: 6px; background: rgba(6, 28, 50, 0.76); }
        .insights strong { display: block; color: #fff; font-size: 17px; font-weight: 850; line-height: 1.4; }
        .insights p { margin: 8px 0 0; color: #c5d6e6; font-size: 13px; line-height: 1.6; word-break: keep-all; }
        .faculty { margin-top: 22px; padding-left: 15px; border-left: 3px solid #d6b574; }
        .faculty p { margin: 0 0 7px; color: #d9bd86; font-size: 22px; font-weight: 800; line-height: 1.45; }
        .faculty strong { color: #fff; font-size: 15px; font-weight: 700; line-height: 1.5; word-break: keep-all; }
        .meta { margin: 19px 0 0; color: #b9cbdd; font-size: 13px; font-weight: 650; line-height: 1.6; }
        .article-link { display: inline-flex; align-items: center; justify-content: center; gap: 14px; min-height: 45px; margin-top: 17px; padding: 11px 23px; border: 1px solid #b89658; border-radius: 5px; background: #dfbc7b; color: #0c2036; font-size: 17px; font-weight: 900; text-decoration: none; }
        .article-link:hover, .article-link:focus-visible { background: #efce90; }
        .popup-actions { display: grid; flex-shrink: 0; grid-template-columns: 1.35fr 1.2fr 0.7fr; margin-top: auto; border-top: 1px solid #a78a58; background: rgba(4, 18, 34, 0.95); }
        .popup-actions button { min-height: 44px; padding: 9px; border: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
        .popup-actions button + button { border-left: 1px solid #385067; }
        .popup-actions button:hover, .popup-actions button:focus-visible { background: #234968; }
        html[lang="en"] h1 { font-size: 35px; }
        @media (max-width: 480px) {
            .content { padding: 24px 20px; }
            .brand { font-size: 9px; letter-spacing: 0.03em; }
            .kicker { margin-top: 18px; font-size: 11px; }
            .summary { font-size: 15px; }
            .insights { gap: 7px; margin-top: 20px; }
            .insights article { padding: 11px 8px; }
            .insights strong { font-size: 14px; }
            .insights p { font-size: 11px; }
            .faculty p { font-size: 19px; }
            .faculty strong { font-size: 13px; }
            .popup-actions button { padding: 9px 3px; font-size: 11px; }
            html[lang="en"] h1 { font-size: 28px; }
            html[lang="en"] .insights strong { font-size: 12px; }
            html[lang="en"] .faculty strong { font-size: 14px; }
        }
    </style>
</head>
<body>
    <main class="news-popup" aria-label="국방 AI 포럼 언론보도 안내">
        <article class="content">
            <p class="brand">K-DEFENSE INDUSTRY RESEARCH INSTITUTE</p>
            <p class="kicker" data-copy="kicker">제11회 부국강병포럼 · 언론보도</p>
            <h1><span data-copy="headline">국방 AI 혁신,</span><span class="accent" data-copy="headlineAccent">K-방산의 새로운 도약</span></h1>
            <p class="summary" data-copy="summary">혁신기술을 실제 전투력으로 연결하고, 벤처·스타트업의 성장을 뒷받침할 국방 AI 생태계를 논의했습니다.</p>
            <div class="insights">
                <article><strong data-copy="deployment">전력화</strong><p data-copy="deploymentText">실증에서 군 도입까지</p></article>
                <article><strong data-copy="acquisition">개방형 획득</strong><p data-copy="acquisitionText">MOSA 기반 기술 혁신</p></article>
                <article><strong data-copy="security">사이버보안</strong><p data-copy="securityText">AI 무기체계 검증 강화</p></article>
            </div>
            <div class="faculty"><p data-copy="faculty">전북대학교 교수진 참여</p><strong data-copy="professors">강은호 · 장원준 · 유준수 교수 등</strong></div>
            <p class="meta" data-copy="meta">서울경제 · 2026.10.10 보도</p>
            <a class="article-link" href="../../pages/community/news-view.html?post=view_59" target="_blank" rel="noopener noreferrer"><span data-copy="article">기사 자세히 보기</span><span aria-hidden="true">→</span></a>
        </article>
        <footer class="popup-actions">
            <button type="button" data-popup-hide-today data-copy="today">오늘 하루 보지 않기</button>
            <button type="button" data-popup-hide-forever data-copy="forever">다시 보지 않기</button>
            <button type="button" data-popup-close data-copy="close">닫기</button>
        </footer>
    </main>
    <script>
        (function () {
            const storageKey = 'jbnuDefenseAiForum261013HiddenUntil';
            if (localStorage.getItem('jbnu-defense-language') === 'en') {
                const copy = {
                    kicker: '11th Buguk Gangbyeong Forum · Media Coverage',
                    headline: 'Defense AI Innovation',
                    headlineAccent: 'A New Path for K-Defense',
                    summary: 'Connecting innovation with operational capability and supporting defense startups through a stronger AI ecosystem.',
                    deployment: 'Deployment', deploymentText: 'From trials to military use',
                    acquisition: 'Open Systems', acquisitionText: 'MOSA-based innovation',
                    security: 'Security', securityText: 'Testing AI-enabled systems',
                    faculty: 'Participating JBNU Faculty',
                    professors: 'Kang Eun-ho · Jang Won-jun · Yoo Joon-su',
                    meta: 'Seoul Economic Daily · October 10, 2026',
                    article: 'Read the Article', today: 'Hide for Today', forever: 'Do Not Show Again', close: 'Close'
                };
                document.documentElement.lang = 'en';
                document.title = 'Defense AI Innovation | K-Defense Industry Research Institute';
                document.querySelector('main').setAttribute('aria-label', 'Defense AI Forum Media Coverage');
                document.querySelectorAll('[data-copy]').forEach(element => { element.textContent = copy[element.dataset.copy]; });
            }
            function closePopup() {
                if (window.opener) { window.close(); return; }
                const targetOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
                window.parent.postMessage({ type: 'jbnu-main-popup-close' }, targetOrigin);
            }
            document.querySelector('[data-popup-hide-today]').addEventListener('click', () => {
                const offset = 9 * 60 * 60 * 1000;
                const day = 24 * 60 * 60 * 1000;
                localStorage.setItem(storageKey, String((Math.floor((Date.now() + offset) / day) + 1) * day - offset));
                closePopup();
            });
            document.querySelector('[data-popup-hide-forever]').addEventListener('click', () => { localStorage.setItem(storageKey, 'forever'); closePopup(); });
            document.querySelector('[data-popup-close]').addEventListener('click', closePopup);
        })();
    </script>
</body>
</html>
