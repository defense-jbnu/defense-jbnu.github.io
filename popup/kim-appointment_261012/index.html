<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>김천석 특임교수, 국방신속획득기술연구원장 취임 | 국방산업연구소</title>
    <style>
        @font-face {
            font-family: "Gmarket Sans";
            src: url("../employment_260928/fonts/GmarketSansBold.woff") format("woff");
            font-weight: 700;
            font-display: swap;
        }
        @font-face {
            font-family: "SUIT Variable";
            src: url("../employment_260928/fonts/SUIT-Variable.woff2") format("woff2-variations");
            font-weight: 100 900;
            font-display: swap;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f7f9fc; color: #142945; font-family: "SUIT Variable", system-ui, sans-serif; }
        .appointment-popup { display: flex; flex-direction: column; min-height: 100vh; border: 3px solid #b99452; }
        .brand { padding: 17px 30px; background: linear-gradient(120deg, #06192e, #123f69); color: #fff; }
        .brand small { display: block; margin-bottom: 5px; color: #d9b777; font-size: 11px; font-weight: 800; letter-spacing: 0.13em; }
        .brand p { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.4; }
        .appointment-content { flex: 1; padding: 27px 32px 24px; background: radial-gradient(ellipse at 100% 0%, #eaf1f8, transparent 65%), #f7f9fc; }
        .profile { display: grid; grid-template-columns: minmax(0, 1fr) 172px; gap: 24px; align-items: center; }
        .badge { display: inline-block; padding: 7px 12px; border: 1px solid #cbd9e8; border-radius: 4px; color: #174a77; font-size: 12px; font-weight: 900; letter-spacing: 0.06em; }
        h1 { margin: 20px 0 10px; font-family: "Gmarket Sans", sans-serif; font-size: 46px; line-height: 1.25; letter-spacing: -0.04em; }
        .position { display: block; margin-top: 8px; font-family: "SUIT Variable", system-ui, sans-serif; color: #496278; font-size: 23px; font-weight: 800; letter-spacing: 0; }
        .expertise { margin: 16px 0 0; color: #52677d; font-size: 17px; font-weight: 700; line-height: 1.65; word-break: keep-all; }
        .portrait { width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; object-position: center 20%; border: 1px solid #cbd9e8; border-radius: 8px; background: #fff; box-shadow: 0 9px 22px rgba(15, 45, 73, 0.1); }
        .appointment-heading { margin: 24px 0 0; padding-top: 21px; border-top: 1px solid #d4dfeb; font-family: "Gmarket Sans", sans-serif; font-size: 30px; line-height: 1.45; letter-spacing: -0.04em; word-break: keep-all; }
        .appointment-heading strong { display: block; color: #956c28; font-size: 34px; }
        .summary { margin: 13px 0 0; color: #52677d; font-size: 17px; font-weight: 650; line-height: 1.65; word-break: keep-all; }
        .meta { margin: 15px 0 0; color: #6b7b8d; font-size: 14px; font-weight: 700; }
        .article-link { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 46px; margin-top: 19px; padding: 10px 22px; border: 1px solid #a27b3a; border-radius: 5px; background: #d3ad69; color: #10233a; font-size: 17px; font-weight: 900; text-decoration: none; }
        .article-link:hover, .article-link:focus-visible { background: #e0bd7f; }
        .popup-actions { display: grid; grid-template-columns: 1.35fr 1.2fr 0.7fr; margin-top: auto; border-top: 1px solid #b99452; background: #0b223d; }
        .popup-actions button { min-height: 44px; padding: 9px; border: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
        .popup-actions button + button { border-left: 1px solid #29465f; }
        .popup-actions button:hover, .popup-actions button:focus-visible { background: #204d72; }
        html[lang="en"] h1 { font-size: 34px; }
        html[lang="en"] .appointment-heading { font-size: 26px; }
        html[lang="en"] .appointment-heading strong { font-size: 26px; }
        @media (max-width: 480px) {
            .brand { padding: 16px 20px; }
            .brand p { font-size: 16px; }
            .brand small { font-size: 9px; letter-spacing: 0.05em; }
            .appointment-content { padding: 22px 20px; }
            .profile { grid-template-columns: minmax(0, 1fr) 112px; gap: 14px; }
            .badge { padding: 6px 8px; font-size: 10px; }
            h1 { margin-top: 14px; font-size: 34px; }
            .position { font-size: 18px; }
            .expertise { margin-top: 10px; font-size: 13px; }
            .appointment-heading { font-size: 24px; }
            .appointment-heading strong { font-size: 28px; }
            .summary { font-size: 15px; }
            .popup-actions button { padding: 9px 3px; font-size: 11px; }
            html[lang="en"] .profile { grid-template-columns: minmax(0, 1fr) 100px; }
            html[lang="en"] h1 { font-size: 22px; }
            html[lang="en"] .position { font-size: 16px; }
            html[lang="en"] .appointment-heading { font-size: 19px; }
            html[lang="en"] .appointment-heading strong { font-size: 23px; }
        }
    </style>
</head>
<body>
    <main class="appointment-popup" aria-label="김천석 특임교수 취임 소식">
        <header class="brand">
            <small>K-DEFENSE INDUSTRY RESEARCH INSTITUTE</small>
            <p data-copy="brand">전북대학교 첨단방위산업학과</p>
        </header>
        <article class="appointment-content">
            <div class="profile">
                <div>
                    <span class="badge">FACULTY NEWS</span>
                    <h1><span data-copy="name">김천석</span><span class="position" data-copy="position">특임교수</span></h1>
                    <p class="expertise" data-copy="expertise">국방·방산획득 분야 전문가<br>예비역 육군 소장</p>
                </div>
                <img class="portrait" src="../../assets/img/people/김천석 교수.jpg" width="2124" height="2832" alt="전북대학교 첨단방위산업학과 김천석 특임교수">
            </div>
            <h2 class="appointment-heading"><span data-copy="organization">국방신속획득기술연구원장</span><strong data-copy="appointment">취임</strong></h2>
            <p class="summary" data-copy="summary">군의 전력 기획과 전투 발전 경험을 바탕으로 첨단 국방기술의 신속한 도입과 획득체계 혁신에 기여합니다.</p>
            <p class="meta" data-copy="date">취임일 2026.10.06 · 전북도민일보 보도</p>
            <a class="article-link" href="../../pages/community/news-view.html?post=view_56" target="_blank" rel="noopener noreferrer"><span data-copy="article">기사 자세히 보기</span><span aria-hidden="true">→</span></a>
        </article>
        <footer class="popup-actions">
            <button type="button" data-popup-hide-today data-copy="today">오늘 하루 보지 않기</button>
            <button type="button" data-popup-hide-forever data-copy="forever">다시 보지 않기</button>
            <button type="button" data-popup-close data-copy="close">닫기</button>
        </footer>
    </main>
    <script>
        (function () {
            const storageKey = 'jbnuDefenseKimAppointment261012HiddenUntil';
            if (localStorage.getItem('jbnu-defense-language') === 'en') {
                const copy = {
                    brand: 'ADTI · Jeonbuk National University',
                    name: 'Kim Cheon-seok',
                    position: 'Special Appointment Professor',
                    expertise: 'Defense acquisition expert · Retired Army Major General',
                    organization: 'Defense Rapid Acquisition Technology Research Institute',
                    appointment: 'Appointed Director',
                    summary: 'Supporting rapid defense technology adoption and acquisition reform.',
                    date: 'Appointed October 6, 2026 · Jeonbuk Domin Ilbo',
                    article: 'Read the Article',
                    today: 'Hide for Today',
                    forever: 'Do Not Show Again',
                    close: 'Close'
                };
                document.documentElement.lang = 'en';
                document.title = 'Faculty Appointment: Kim Cheon-seok | K-Defense Industry Research Institute';
                document.querySelector('main').setAttribute('aria-label', 'Faculty Appointment: Kim Cheon-seok');
                document.querySelector('img').alt = 'Professor Kim Cheon-seok, Department of Advanced Defense Technology and Industry, JBNU';
                document.querySelectorAll('[data-copy]').forEach(element => {
                    element.textContent = copy[element.dataset.copy];
                });
            }

            function closePopup() {
                if (window.opener) { window.close(); return; }
                const targetOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
                window.parent.postMessage({ type: 'jbnu-main-popup-close' }, targetOrigin);
            }
            document.querySelector('[data-popup-hide-today]').addEventListener('click', () => {
                const offset = 9 * 60 * 60 * 1000;
                const day = 24 * 60 * 60 * 1000;
                const nextMidnight = (Math.floor((Date.now() + offset) / day) + 1) * day - offset;
                localStorage.setItem(storageKey, String(nextMidnight));
                closePopup();
            });
            document.querySelector('[data-popup-hide-forever]').addEventListener('click', () => {
                localStorage.setItem(storageKey, 'forever');
                closePopup();
            });
            document.querySelector('[data-popup-close]').addEventListener('click', closePopup);
        })();
    </script>
</body>
</html>
