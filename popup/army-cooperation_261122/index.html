<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>전북대·육군 방산·군수 협력 | 국방산업연구소</title>
    <style>
        @font-face { font-family: "Gmarket Sans"; src: url("../employment_260928/fonts/GmarketSansBold.woff") format("woff"); font-weight: 700; font-display: swap; }
        @font-face { font-family: "SUIT"; src: url("../employment_260928/fonts/SUIT-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #07182c; color: #fff; font-family: "SUIT", system-ui, sans-serif; }
        .popup { display: flex; height: 100vh; height: 100dvh; flex-direction: column; border: 3px solid #c6a267; background: linear-gradient(145deg, #0c2947, #07182c 70%); }
        header { flex-shrink: 0; padding: 20px 30px; border-bottom: 1px solid #35516d; }
        .brand { margin: 0; color: #f2f6fa; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
        .content { flex: 1; min-height: 0; overflow-y: auto; padding: 25px 30px 28px; }
        .kicker { display: inline-block; margin: 0 0 14px; padding: 6px 11px; border: 1px solid #a78b5e; border-radius: 4px; color: #e4c38c; font-size: 15px; font-weight: 800; }
        h1 { margin: 0; font-family: "Gmarket Sans", sans-serif; font-size: clamp(28px, 5.8vw, 38px); font-weight: 700; line-height: 1.45; letter-spacing: -0.045em; word-break: keep-all; }
        h1 span { display: block; }
        .accent { color: #edc784; }
        figure { margin: 22px 0 0; }
        figure img { display: block; width: 100%; height: clamp(180px, 27vh, 230px); object-fit: cover; object-position: center 34%; border: 1px solid #557089; border-radius: 6px; }
        figcaption { margin-top: 7px; color: #b3c5d7; font-size: 12px; line-height: 1.5; }
        .summary { margin: 18px 0 0; color: #e0e9f2; font-size: 18px; font-weight: 600; line-height: 1.7; word-break: keep-all; }
        .topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
        .topics article { padding: 14px 12px; border: 1px solid #3b5874; border-radius: 6px; background: #102e4b; }
        .topics strong { display: block; font-size: 18px; font-weight: 850; }
        .topics p { margin: 5px 0 0; color: #bed0e1; font-size: 14px; line-height: 1.6; word-break: keep-all; }
        .meta { margin: 17px 0 0; color: #b3c5d7; font-size: 13px; }
        .article-link { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 54px; margin-top: 17px; padding: 13px 20px; border-radius: 6px; background: #e5c18a; color: #10263f; font-size: 20px; font-weight: 900; text-decoration: none; }
        .article-link:hover, .article-link:focus-visible { background: #f6d6a2; }
        footer { display: flex; flex-shrink: 0; margin-top: auto; border-top: 1px solid #49617a; background: #07172a; }
        footer button { flex: 1; min-height: 48px; padding: 10px 5px; border: 0; background: transparent; color: #e5edf6; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
        footer button + button { border-left: 1px solid #354b64; }
        footer button:hover, footer button:focus-visible { background: #1a3e61; }
        html[lang="en"] h1 { font-size: clamp(25px, 5vw, 32px); }
        html[lang="en"] .brand { font-size: 16px; }
        @media (max-width: 420px) {
            header { padding: 17px 20px; }
            .brand { font-size: 18px; }
            .content { padding: 22px 20px; }
            .summary { font-size: 17px; }
            .topics { gap: 7px; }
            .topics article { padding: 12px 8px; }
            .topics strong { font-size: 15px; }
            .topics p { font-size: 12px; }
            .article-link { font-size: 18px; }
            footer button { font-size: 12px; }
            html[lang="en"] .topics { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="popup" aria-label="전북대·육군 방산·군수 분야 협력 안내">
        <header><p class="brand" data-copy="brand">전북대학교 국방산업연구소</p></header>
        <article class="content">
            <p class="kicker" data-copy="kicker">산·학·연·군 협력 · 업무협약 체결</p>
            <h1><span data-copy="headline">전북대·육군,</span><span class="accent" data-copy="headlineAccent">첨단 방산·군수 협력</span></h1>
            <figure>
                <img src="army-cooperation.jpg" alt="전북대학교 국방산업연구소와 육군본부 군수참모부의 업무협약 기념사진" width="670" height="446">
                <figcaption data-copy="caption">2026.11.19 전북대학교 · 사진 제공: 전북대학교</figcaption>
            </figure>
            <p class="summary" data-copy="summary">국방산업연구소와 육군본부 군수참모부가 대학의 연구·교육 역량과 군의 현장 전문성을 연결해 미래 군수혁신과 전문인력 양성을 함께 추진합니다.</p>
            <div class="topics">
                <article><strong data-copy="policy">정책연구</strong><p data-copy="policyText">첨단 군수지원체계 발전</p></article>
                <article><strong data-copy="education">인재 양성</strong><p data-copy="educationText">전문교육·교육과정 협력</p></article>
                <article><strong data-copy="global">국제협력</strong><p data-copy="globalText">국제군수포럼·학술 교류</p></article>
            </div>
            <p class="meta" data-copy="meta">글로벌이코노믹 · 2026.11.20 보도</p>
            <a class="article-link" href="../../pages/community/news-view.html?post=view_76" target="_top"><span data-copy="article">기사 자세히 보기</span><span aria-hidden="true">→</span></a>
        </article>
        <footer>
            <button type="button" data-hide-today data-copy="today">오늘 하루 보지 않기</button>
            <button type="button" data-hide-forever data-copy="forever">다시 보지 않기</button>
            <button type="button" data-close data-copy="close">닫기</button>
        </footer>
    </main>
    <script>
        (function () {
            const storageKey = 'jbnuArmyCooperation261122HiddenUntil';
            if (localStorage.getItem('jbnu-defense-language') === 'en') {
                const copy = {
                    brand: 'K-Defense Industry Research Institute',
                    kicker: 'University–Industry–Research–Military Partnership',
                    headline: 'JBNU & the ROK Army',
                    headlineAccent: 'Advancing Defense Logistics',
                    caption: 'November 19, 2026 · JBNU · Photo: JBNU',
                    summary: 'The institute and the ROK Army Logistics Staff Department are combining university research and education with military expertise to advance defense logistics and develop professional talent.',
                    policy: 'Policy Research', policyText: 'Advanced logistics support',
                    education: 'Talent Development', educationText: 'Professional education and curricula',
                    global: 'Global Cooperation', globalText: 'Logistics forums and academic exchange',
                    meta: 'Global Economic · November 20, 2026',
                    article: 'Read the Article', today: 'Hide for Today', forever: 'Do Not Show Again', close: 'Close'
                };
                document.documentElement.lang = 'en';
                document.title = 'JBNU–ROK Army Cooperation | K-Defense Industry Research Institute';
                document.querySelector('main').setAttribute('aria-label', 'JBNU and ROK Army defense logistics partnership');
                document.querySelector('img').alt = 'Cooperation agreement ceremony between the institute and the ROK Army Logistics Staff Department';
                document.querySelectorAll('[data-copy]').forEach(element => { element.textContent = copy[element.dataset.copy]; });
            }
            function closePopup() {
                if (window.opener) { window.close(); return; }
                const targetOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
                window.parent.postMessage({ type: 'jbnu-main-popup-close' }, targetOrigin);
            }
            document.querySelector('.article-link').addEventListener('click', event => {
                if (window.opener && !window.opener.closed) {
                    event.preventDefault();
                    window.opener.location.href = event.currentTarget.href;
                    window.opener.focus();
                    window.close();
                }
            });
            document.querySelector('[data-hide-today]').addEventListener('click', () => {
                const offset = 9 * 60 * 60 * 1000;
                const day = 24 * 60 * 60 * 1000;
                localStorage.setItem(storageKey, String((Math.floor((Date.now() + offset) / day) + 1) * day - offset));
                closePopup();
            });
            document.querySelector('[data-hide-forever]').addEventListener('click', () => { localStorage.setItem(storageKey, 'forever'); closePopup(); });
            document.querySelector('[data-close]').addEventListener('click', closePopup);
        })();
    </script>
</body>
</html>
