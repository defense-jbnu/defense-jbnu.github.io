name: 주간 기사 검색 및 검토

on:
  push:
    paths:
      - .github/workflows/news-review.yml
      - .github/news-review-config.json
      - scripts/news_review.py
      - scripts/publish_news_review.py
      - scripts/tests/test_news_review.py
  workflow_dispatch:
    inputs:
      mode:
        description: "demo: 샘플 화면 / naver: 이용 허용 확인 후 실제 검색"
        required: true
        type: choice
        default: demo
        options:
          - demo
          - naver
      create_pr:
        description: "검토용 Draft PR 생성 (홈페이지 게시와 별개)"
        required: true
        type: boolean
        default: false
  schedule:
    # Monday 09:17 KST. Schedule requires this file on the default branch.
    - cron: "17 0 * * 1"

permissions:
  contents: read

concurrency:
  group: news-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.NEWS_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      REVIEW_MODE: ${{ github.event_name == 'schedule' && 'naver' || inputs.mode || 'demo' }}
      CREATE_PR: ${{ github.event_name == 'schedule' && 'true' || inputs.create_pr }}
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 선별·중복 검사 테스트
        run: python3 -m unittest discover -s scripts/tests -p 'test_news_review.py' -v
      - name: 검토자료 생성
        env:
          NAVER_NEWS_STORAGE_ALLOWED: ${{ vars.NAVER_NEWS_STORAGE_ALLOWED }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 scripts/news_review.py --mode "$REVIEW_MODE" --output "$RUNNER_TEMP/news-review.md"
      - name: 실행 화면에 검토자료 표시
        shell: python
        run: |
          import os
          from pathlib import Path
          report = (Path(os.environ["RUNNER_TEMP"]) / "news-review.md").read_text(encoding="utf-8")
          summary = report[:50000]
          if len(report) > 50000:
              summary += "\n\n검토자료가 길어 일부만 표시합니다. PR 생성 옵션을 켜면 전체 파일을 확인할 수 있습니다.\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
      - name: 검토용 PR 생성
        if: env.CREATE_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_news_review.py --report "$RUNNER_TEMP/news-review.md" --mode "$REVIEW_MODE"
